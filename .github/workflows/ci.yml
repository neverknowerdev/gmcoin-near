name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          cargo install cargo-near --locked
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and contract tests
        run: cargo test --workspace --exclude sandbox-tests --exclude module-tests --exclude testnet-e2e
      - name: Build contract WASM (fails if mainnet core exports a staging method)
        run: ./scripts/build.sh
      - name: WASM size check
        run: |
          for f in res/gm_token.wasm res/gm_core.wasm; do
            size=$(stat -c%s "$f"); echo "$f $size bytes"
            test "$size" -lt 450000
          done
      - name: Sandbox integration tests
        run: cargo test -p sandbox-tests -- --test-threads=4
      - name: OutLayer modules
        run: |
          ./scripts/build-modules.sh
          cargo test -p module-tests

  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
