name: staging

# Nightly and on merge to main: deploy a fresh staging copy to testnet
# (staging build, 10-minute days, mock OutLayer) and walk a full week.
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testnet-e2e:
    runs-on: ubuntu-latest
    environment: testnet
    env:
      MASTER: ${{ vars.TESTNET_MASTER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          cargo install cargo-near near-cli-rs --locked
      - name: Testnet key (testnet only; mainnet keys never live in GitHub)
        run: |
          mkdir -p ~/.near-credentials/testnet
          echo '${{ secrets.TESTNET_MASTER_KEY_JSON }}' > ~/.near-credentials/testnet/$MASTER.json
      - run: ./scripts/build.sh
      - name: Deploy run-scoped staging contracts
        run: python3 scripts/deploy.py --network testnet --master "$MASTER" --prefix "ci${{ github.run_number }}-" --staging --mock-outlayer
      - name: End-to-end week on testnet
        run: GM_TESTNET_DEPLOY=deploy/testnet.ci${{ github.run_number }}-$MASTER.out.json cargo test -p testnet-e2e -- --ignored --nocapture
