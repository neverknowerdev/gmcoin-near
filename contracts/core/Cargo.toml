[package]
name = "gm-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GM core: users, X linking, daily scans via OutLayer, settlement and weekly emission"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Staging-only methods (advance_clock). Mainnet builds leave this off.
staging = []

[dependencies]
near-sdk.workspace = true
serde_json.workspace = true
gm-scoring.workspace = true
epochs.workspace = true
caps.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
